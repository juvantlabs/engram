[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engram"
version = "0.2.0"
description = "Python-native browser automation with cached LLM-resolved selectors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juvant", email = "dev@juvant.io" }]
keywords = ["browser", "automation", "playwright", "llm", "caching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "playwright>=1.44",
    "litellm>=1.50",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "lxml>=5.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-lxml>=2024.4.14",
    "redis>=5.0",
]

# ``[project.urls]`` MUST come after every top-level ``[project]`` key —
# once the sub-table is opened, any subsequent bare key (``dependencies``,
# etc.) gets attributed to it, not to ``[project]``.
[project.urls]
Homepage = "https://github.com/juvantlabs/engram"
Repository = "https://github.com/juvantlabs/engram"
Issues = "https://github.com/juvantlabs/engram/issues"
Changelog = "https://github.com/juvantlabs/engram/blob/master/CHANGELOG.md"
Documentation = "https://github.com/juvantlabs/engram#readme"
Security = "https://github.com/juvantlabs/engram/blob/master/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["engram"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line-too-long — ruff format handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"] # allow assert False in tests

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]
